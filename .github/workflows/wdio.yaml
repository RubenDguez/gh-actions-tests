name: WDIO

on:
  workflow_dispatch:
    inputs:
      NUMBER_OF_RUNNERS:
        required: true
        type: number
        description: How many runners do you want this work flow to use ?
        default: 5

jobs:
  send-notification-email:
    runs-on: ubuntu-latest

    steps:
      - name: Emailer Action
        uses: RubenDguez/emailer@v0.1.1-alpha
        with:
          secrets_user: ${{ secrets.EMAIL_USER }}
          secrets_pass: ${{ secrets.EMAIL_PASS }}
          from: 'GH-ACTIONS-TESTS donot.reply@github.com <${{ secrets.EMAIL_USER }}>'
          to: 'argenis.dominguez@hotmail.com'
          subject: 'WDIO Is About to start'
          html: '<h1>Hello there, the WDIO Workflow is about to start</h1>'

  setup-matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}

    steps:
      - name: Set Matrix
        id: set-matrix
        run: |
          EOF=$(dd if=/dev/urandom bs=15 count=1 status=none | base64)
          RNERS=${{ inputs.NUMBER_OF_RUNNERS }}
          echo "matrix=[$(seq -s, 1 $RNERS)]" | sed 's/,$//' >> "$GITHUB_OUTPUT"

  run-scripts:
    needs: setup-matrix
    runs-on: ubuntu-latest
    strategy:
      matrix:
        runner: ${{ fromJson(needs.setup-matrix.outputs.matrix) }}

    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/wdio
        with:
          current: ${{ matrix.runner }}
          of: ${{ inputs.NUMBER_OF_RUNNERS }}
          run_id: ${{ github.run_id }}

  generate-report:
    needs: run-scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/allure/generate/

  send-report-link-email:
    needs: generate-report
    runs-on: ubuntu-latest

    steps:
      - name: Emailer Action
        uses: RubenDguez/emailer@v0.1.1-alpha
        with:
          secrets_user: ${{ secrets.EMAIL_USER }}
          secrets_pass: ${{ secrets.EMAIL_PASS }}
          from: 'GH-ACTIONS-TESTS donot.reply@github.com <${{ secrets.EMAIL_USER }}>'
          to: 'argenis.dominguez@hotmail.com'
          subject: 'WDIO just finished running'
          html: '
            <div>
              <h1>Hello there, the WDIO Workflow just finished running</h1>
              <p>Please follow this link in order to download the report <a href="www.google.com">click here.</a></p>
            </div>
            '
        