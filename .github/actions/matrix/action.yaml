name: Generate Matrix
description: Generate Matrix
author: Argenis Ruben Dominguez
email: argenis.dominguez@hotmail.com

inputs:
  path:
    required: true
    description: Path to the test specs

outputs:
  matrix:
    description: Comma-separated list of numbers to use in a matrix
    value: ${{ steps.set-matrix.outputs.matrix }}

  runners:
    description: Total count of .ts files
    value: ${{ steps.set-matrix.outputs.runners }}

runs:
  using: composite
  steps:
    - name: Set Matrix
      id: set-matrix
      shell: bash
      run: ./index.sh
