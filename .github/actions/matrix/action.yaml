name: Generate Matrix
description: Generate Matrix
author: Argenis Ruben Dominguez
email: argenis.dominguez@hotmail.com

inputs:
  path:
    required: true
    description: Path to the test specs

outputs:
  matrix:
    description: Comma-separated list of numbers to use in a matrix

  runners:
    description: Total count of .ts files

runs:
  using: composite
  steps:
    - name: Set Matrix
      id: set-matrix
      shell: bash
      run: |
        path=${{ inputs.path }}
        runners=$(find "$path" -type f -name "*.ts" | wc -l | xargs)
        matrix=$(seq -s, 1 $runners | sed 's/,$//')
        echo "matrix=$matrix" >> "${GITHUB_OUTPUT}"
        echo "runners=$runners" >> "${GITHUB_OUTPUT}"
